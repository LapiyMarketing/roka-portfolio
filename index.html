<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Work | Roka Projects</title>

<style>
:root{
  --terracotta:#ed542b;
  --indigo:#1d2d60;
  --black:#000000;
  --platinum:#ededef;
  --white:#ffffff;
  --ink:#1a1a1a;
  --muted:#6b6f76;
  --line:#e3e3e6;
  --radius:4px;
  --maxw:1240px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  color:var(--ink);
  background:var(--white);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}

/* Header band */
.intro{padding:48px 0 28px}
.intro h1{
  font-family:'Inter',sans-serif;
  font-weight:700;
  font-size:clamp(30px,4.5vw,46px);
  letter-spacing:-0.02em;
  color:var(--indigo);
  margin-bottom:14px;
}
.intro p{
  font-family:'Quicksand',sans-serif;
  font-weight:400;
  font-size:clamp(15px,1.6vw,18px);
  color:var(--muted);
  max-width:620px;
}

/* Filters */
.filters{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,0.94);
  backdrop-filter:saturate(180%) blur(8px);
  border-bottom:1px solid var(--line);
  padding:20px 0 14px;
}
.filter-row{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.filter-group{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filter-label{
  font-family:'Quicksand',sans-serif;font-weight:600;font-size:12px;
  text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);
  margin-right:2px;
}
.pill{
  font-family:'Quicksand',sans-serif;font-weight:500;font-size:13.5px;
  border:1px solid var(--line);background:var(--white);color:var(--ink);
  padding:7px 15px;border-radius:999px;cursor:pointer;transition:all .15s ease;
  white-space:nowrap;
}
.pill:hover{border-color:var(--indigo);color:var(--indigo)}
.pill.active{background:var(--indigo);border-color:var(--indigo);color:#fff}
.pill.loc.active{background:var(--terracotta);border-color:var(--terracotta)}
.count{
  font-family:'Quicksand',sans-serif;font-size:13px;color:var(--muted);
  margin-left:auto;white-space:nowrap;
}

/* Grid */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-auto-rows:1fr;
  gap:26px;
  padding:34px 0 24px;
  align-content:start;
}
@media(max-width:920px){.grid{grid-template-columns:repeat(2,1fr);gap:20px}}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
.card.placeholder{
  visibility:hidden;pointer-events:none;border:0;background:transparent;box-shadow:none;
}

.pager{
  display:flex;justify-content:center;align-items:center;gap:8px;
  padding:4px 0 56px;
}
.page-btn{
  font-family:'Quicksand',sans-serif;font-weight:600;font-size:14px;
  min-width:38px;height:38px;padding:0 12px;
  border:1px solid var(--line);background:var(--white);color:var(--ink);
  border-radius:4px;cursor:pointer;transition:all .15s ease;
}
.page-btn:hover:not(:disabled){border-color:var(--indigo);color:var(--indigo)}
.page-btn.active{background:var(--indigo);border-color:var(--indigo);color:#fff}
.page-btn.nav{font-size:18px;line-height:1}
.page-btn:disabled{opacity:.35;cursor:default}

.card{
  display:flex;flex-direction:column;
  min-height:534px;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  text-decoration:none;color:inherit;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
  opacity:0;animation:rise .5s ease forwards;
}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
.card{transform:translateY(12px)}
.card:hover{
  transform:translateY(-4px);
  box-shadow:0 14px 34px rgba(29,45,96,0.14);
  border-color:transparent;
}
.thumb{
  position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;background:var(--platinum);
}
.thumb img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .5s ease;
}
.card:hover .thumb img{transform:scale(1.05)}
.loc-tag{
  position:absolute;top:12px;left:12px;
  font-family:'Quicksand',sans-serif;font-weight:600;font-size:11.5px;
  text-transform:uppercase;letter-spacing:0.06em;
  background:rgba(29,45,96,0.92);color:#fff;
  padding:5px 10px;border-radius:3px;
}
.body{padding:18px 18px 20px;display:flex;flex-direction:column;flex:1}
.card h3{
  font-family:'Inter',sans-serif;font-weight:600;font-size:18px;
  letter-spacing:-0.01em;color:var(--indigo);margin-bottom:6px;line-height:1.25;
}
.scope{
  font-family:'Quicksand',sans-serif;font-weight:500;font-size:12.5px;
  color:var(--terracotta);margin-bottom:10px;
}
.blurb{font-size:13.5px;color:var(--muted);line-height:1.5;margin-bottom:14px;flex:1}
.meta{
  display:flex;flex-wrap:wrap;gap:14px;
  font-family:'Quicksand',sans-serif;font-size:12px;color:var(--ink);
  padding-top:12px;border-top:1px solid var(--line);
}
.meta span{display:inline-flex;flex-direction:column;line-height:1.3}
.meta b{font-weight:600;font-size:13px;color:var(--indigo)}
.meta small{font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted)}
.view{
  margin-top:14px;
  font-family:'Quicksand',sans-serif;font-weight:600;font-size:13px;
  color:var(--terracotta);display:inline-flex;align-items:center;gap:6px;
}
.view svg{transition:transform .2s ease}
.card:hover .view svg{transform:translateX(4px)}

.empty{
  grid-column:1/-1;text-align:center;padding:60px 0;color:var(--muted);
  font-family:'Quicksand',sans-serif;font-size:16px;
}
.note{
  margin-top:26px;
  font-family:'Quicksand',sans-serif;font-size:13.5px;line-height:1.5;
  color:var(--indigo);background:var(--platinum);
  border-left:3px solid var(--terracotta);
  padding:12px 16px;border-radius:3px;
}
</style>
</head>

const PARAMS=new URLSearchParams(location.search);
function matchOption(input, options){
  if(!input) return "All";
  const want=input.trim().toLowerCase();
  let hit=options.find(o=>o.toLowerCase()===want);
  if(hit) return hit;
  const alias={"renovations":"Renovations & Additions","renovation":"Renovations & Additions",
    "additions":"Renovations & Additions","renovations-additions":"Renovations & Additions",
    "home-additions":"Renovations & Additions",
    "kitchen":"Kitchens","kitchens":"Kitchens",
    "bathroom":"Bathrooms","bathrooms":"Bathrooms",
    "structural":"Structural","structural-work":"Structural",
    "exterior":"Exterior Renovations","exterior-renovations":"Exterior Renovations"};
  if(alias[want] && options.includes(alias[want])) return alias[want];
  hit=options.find(o=>o.toLowerCase().includes(want)||want.includes(o.toLowerCase()));
  return hit||"All";
}
let activeCat=matchOption(PARAMS.get("category"), CATS);

function money(n){return n?("$"+Number(n).toLocaleString("en-CA")):null}

function buildFilters(){
  const cat=document.getElementById("catFilters");
  ["All",...CATS].forEach(c=>{
    const b=document.createElement("button");
    b.className="pill cat"+(c===activeCat?" active":"");
    b.textContent=c; b.dataset.val=c;
    b.onclick=()=>{activeCat=c;currentPage=1;render();syncPills()};
    cat.appendChild(b);
  });
}
function syncPills(){
  document.querySelectorAll(".pill.cat").forEach(p=>p.classList.toggle("active",p.dataset.val===activeCat));
}

const PER_PAGE=6;
let currentPage=1;

function render(){
  const grid=document.getElementById("grid");
  const pager=document.getElementById("pager");
  const list=PROJECTS.filter(p=>activeCat==="All"||(p.categories||[]).includes(activeCat));

  const totalPages=Math.max(1,Math.ceil(list.length/PER_PAGE));
  if(currentPage>totalPages) currentPage=totalPages;
  const start=(currentPage-1)*PER_PAGE;
  const pageItems=list.slice(start,start+PER_PAGE);

  document.getElementById("count").textContent="";

  grid.innerHTML="";
  if(!list.length){
    grid.innerHTML='<div class="empty">No projects in this category yet.</div>';
    pager.innerHTML="";
    return;
  }
  pageItems.forEach((p,i)=>{
    const a=document.createElement("a");
    a.className="card"; a.href=p.url; a.target="_top"; a.rel="noopener";
    a.style.animationDelay=(i*45)+"ms";
    const meta=[];
    if(p.timeline) meta.push(`<span><small>Timeline</small><b>${p.timeline}</b></span>`);
    if(p.year) meta.push(`<span><small>Completed</small><b>${p.year}</b></span>`);
    a.innerHTML=`
      <div class="thumb">
        <img src="${p.thumb}" alt="${p.title} ${p.type||''} by Roka Projects in ${p.location||''}" loading="lazy">
        ${p.location?`<span class="loc-tag">${p.location}</span>`:""}
      </div>
      <div class="body">
        <h3>${p.title}</h3>
        ${p.type?`<div class="scope">${p.type}</div>`:""}
        ${p.blurb?`<p class="blurb">${p.blurb}</p>`:""}
        ${meta.length?`<div class="meta">${meta.join("")}</div>`:""}
        <span class="view">View project
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </span>
      </div>`;
    grid.appendChild(a);
  });

  // Pad the last page with invisible placeholders so every page is the same
  // height (a full 6-card grid). Keeps the embed from shrinking on the last page.
  if(list.length>PER_PAGE){
    for(let k=pageItems.length;k<PER_PAGE;k++){
      const ph=document.createElement("div");
      ph.className="card placeholder";
      ph.setAttribute("aria-hidden","true");
      ph.innerHTML=`
        <div class="thumb"></div>
        <div class="body">
          <h3>&nbsp;</h3>
          <div class="scope">&nbsp;</div>
          <p class="blurb">&nbsp;<br>&nbsp;</p>
          <div class="meta"><span><small>&nbsp;</small><b>&nbsp;</b></span></div>
          <span class="view">&nbsp;</span>
        </div>`;
      grid.appendChild(ph);
    }
  }

  renderPager(totalPages);
  postHeight();
}

function renderPager(totalPages){
  const pager=document.getElementById("pager");
  pager.innerHTML="";
  if(totalPages<=1) return;

  const mk=(label,page,opts={})=>{
    const b=document.createElement("button");
    b.className="page-btn"+(opts.active?" active":"")+(opts.nav?" nav":"");
    b.textContent=label;
    if(opts.disabled){ b.disabled=true; }
    else b.onclick=()=>{ currentPage=page; render(); };
    return b;
  };

  pager.appendChild(mk("‹",currentPage-1,{nav:true,disabled:currentPage===1}));
  for(let i=1;i<=totalPages;i++){
    pager.appendChild(mk(String(i),i,{active:i===currentPage}));
  }
  pager.appendChild(mk("›",currentPage+1,{nav:true,disabled:currentPage===totalPages}));
}

buildFilters();
render();

/* iframe auto-resize: report height to the Squarespace parent so the embed
   matches the current page height (every full page is the same height). */
function postHeight(){
  const h=document.documentElement.scrollHeight;
  if(window.parent!==window) window.parent.postMessage({rokaPortfolioHeight:h},"*");
}
window.addEventListener("load",postHeight);
window.addEventListener("resize",postHeight);
new ResizeObserver(postHeight).observe(document.body);
</script>
</body>
